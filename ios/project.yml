name: CoupleApp
options:
  bundleIdPrefix: com.coupleapp
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  xcodeVersion: "15.0"
  # ⚠️ 必须显式指定：XcodeGen 2.46+ 默认生成 Xcode 16 格式（objectVersion 77），
  # 而 GitHub Actions 的 macos-14 跑的是 Xcode 15.4，会报
  # "cannot be opened because it is in a future Xcode project file format (77)"。
  # xcode15_0 = objectVersion 60，Xcode 15 与 Xcode 16 都能正常打开。
  projectFormat: xcode15_0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    # 与 GitHub Release tag v1.0.8 对齐：MARKETING_VERSION = 1.0.8，CURRENT_PROJECT_VERSION = 8
    MARKETING_VERSION: "1.0.8"
    CURRENT_PROJECT_VERSION: "8"
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      ONLY_ACTIVE_ARCH: NO
      VALIDATE_PRODUCT: YES

targets:
  # ---------------------------------------------------------------
  # 完整版：与轻量版代码完全相同（已移除小组件扩展），
  # 只保留两个 target 方便沿用原来的打包 / 安装习惯
  # ---------------------------------------------------------------
  CoupleApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Support/App-Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: CoupleApp
        PRODUCT_BUNDLE_IDENTIFIER: com.coupleapp.ios
        INFOPLIST_FILE: Support/App-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  # ---------------------------------------------------------------
  # 轻量版：与完整版代码完全相同，只是 Bundle ID / 显示名不同
  # ---------------------------------------------------------------
  CoupleAppLite:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Support/App-Info-Lite.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: CoupleAppLite
        PRODUCT_BUNDLE_IDENTIFIER: com.coupleapp.ios.lite
        INFOPLIST_FILE: Support/App-Info-Lite.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

schemes:
  CoupleApp:
    build:
      targets:
        CoupleApp: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
  CoupleAppLite:
    build:
      targets:
        CoupleAppLite: all
    run:
      config: Debug
    archive:
      config: Release
